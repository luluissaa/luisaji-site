name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails the whole workflow with a specific file/field error if any
      # data/*.json is malformed or missing a required field — see
      # scripts/validate.js for what it checks.
      - run: npm run validate

      # Served from luluissaa.github.io/luisaji-site/ until the luisaji.com
      # cutover — remove BASE_PATH once the custom domain is live.
      - run: npm run build
        env:
          BASE_PATH: /luisaji-site

      # On a pull request, stop here — build + validate passing is the
      # "preview" signal for now. Only a push to main deploys.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
